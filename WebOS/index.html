<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluetro OS 1.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

  <!-- Logon Screen -->
  <div id="logon-screen">
    <div class="login-card">
      <button class="back-btn" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>

      <div class="avatar-box">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 3 0 0 1-3 3zm0 4c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/>
        </svg>
      </div>

      <div class="user-credentials">
        <h2 class="username">User</h2>
        <form class="password-wrapper" id="login-form">
          <input type="password" class="password-input" id="password-field" placeholder="Password" autofocus>
          <button type="submit" class="submit-btn" aria-label="Submit">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
        <p id="hint-text" class="hint-text hidden"></p>
        <div class="welcome-box hidden" id="welcome-box">
          <div class="spinner"></div>
          <span class="welcome-text">Welcome</span>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="bottom-left">
        <button id="logon-info-btn" class="icon-btn" title="System Info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="12" x2="12" y2="16"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
    </button>
            <button id="logon-net-btn" class="icon-btn" title="Network">
          <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14 0M8.5 16.15a6 6 0 0 1 7 0"/><line x1="12" y1="20" x2="12.01" y2="20" stroke-width="3"/></svg>
        </button>
      </div>
      <div class="bottom-right">
        <span class="lang-text">ENG</span>
        <button id="logon-power-btn" class="icon-btn" title="Power">
          <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Desktop Screen -->
  <div id="desktop-screen" class="hidden">
    
    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
      <div class="context-item" id="ctx-personalize">
        <svg viewBox="0 0 24 24" class="ctx-icon"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.54 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
        Personalize
      </div>
    </div>

    <!-- Desktop Icons Container -->
    <div class="desktop-icons" id="desktop-icons">
      <div class="desktop-icon" id="dicon-this-pc" data-window="this-pc">
        <div class="icon-img-box pc-icon">💻</div>
        <span>This System</span>
      </div>

      <div class="desktop-icon" id="dicon-network" data-window="network">
        <div class="icon-img-box net-icon">🌐</div>
        <span>My Network</span>
      </div>

      <div class="desktop-icon" id="dicon-recycle" data-window="recycle-bin">
        <div class="icon-img-box bin-icon">🗑️</div>
        <span>Trash</span>
      </div>

      <div class="desktop-icon" id="dicon-github" data-window="browser-github">
        <div class="icon-img-box gh-icon">
          <svg viewBox="0 0 24 24" fill="#ffffff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        </div>
        <span>Dev's GitHub</span>
      </div>
    </div>

    <!-- Window Containers Dynamic Zone -->
    <div id="windows-container"></div>

    <!-- Taskbar -->
    <div id="taskbar">
      <div class="taskbar-left">
        <button id="start-btn" title="Begin">
          <svg viewBox="0 0 100 100" class="start-logo-svg">
            <path d="M 12 12 A 32 32 0 0 1 44 44 L 12 44 Z" fill="#ffffff"/>
            <path d="M 88 12 L 52 44 L 52 28 A 16 16 0 0 1 88 12 Z" fill="#ffffff"/>
            <path d="M 12 88 L 44 52 L 28 52 A 16 16 0 0 1 12 88 Z" fill="#ffffff"/>
            <path d="M 52 52 L 88 52 A 36 36 0 0 1 52 88 Z" fill="#ffffff"/>
          </svg>
        </button>

        <div class="pinned-apps">
          <!-- Browser Icon -->
          <button class="taskbar-app-btn icon-blue" id="tb-browser" title="Browser">
            <img src="https://img.icons8.com/pulsar-line/48/internet.png" alt="Browser" />
          </button>
          <!-- Explorer Icon -->
          <button class="taskbar-app-btn icon-yellow" id="tb-explorer" title="Explorer">
            <img src="https://img.icons8.com/pulsar-line/48/windows-explorer.png" alt="Explorer" />
          </button>
          <!-- Store Icon -->
          <button class="taskbar-app-btn icon-green" id="tb-store" title="Store">
            <img src="https://img.icons8.com/pulsar-line/48/shopping-bag.png" alt="Store" />
          </button>
        </div>
      </div>

      <div id="system-tray">
        <button class="tray-btn">^</button>
        <button class="tray-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
            <path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M8.5 16.15a6 6 0 0 1 7 0"/><line x1="12" y1="20" x2="12.01" y2="20" stroke-width="3"/>
          </svg>
        </button>
        <button class="tray-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
        <div class="tray-clock">
          <span id="taskbar-time">12:00 PM</span>
          <span id="taskbar-date">8/17/2026</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
